apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: azentia
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 108631844439.dkr.ecr.ap-south-1.amazonaws.com/azentia-frontend:latest
          ports:
            - containerPort: 8081
          env:
            - name: REACT_APP_API_URL
              value: '/api'
