version: '3.6'
services:
  db:
    image: postgres:16.0
    restart: always
    ports:
      - 5440:5432
    environment:
      POSTGRES_PASSWORD: azentia
      POSTGRES_USER: azentia
      POSTGRES_DB: azentia
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./pg:/docker-entrypoint-initdb.d/

volumes:
  db_data:
