version: '3.8'

services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./services/web/Dockerfile
      args:
        ENVIRONMENT: production
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_ENABLE_AI_CHAT: ${NEXT_PUBLIC_ENABLE_AI_CHAT}
        NEXT_PUBLIC_ENCRYPTION_KEY: ${NEXT_PUBLIC_ENCRYPTION_KEY}

    restart: always

    env_file:
      - .env

    environment:
      NODE_ENV: production
      WEB_PORT: 8081
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_ENABLE_AI_CHAT: ${NEXT_PUBLIC_ENABLE_AI_CHAT}
      NEXT_PUBLIC_ENCRYPTION_KEY: ${NEXT_PUBLIC_ENCRYPTION_KEY}

    ports:
      - '8081:8081'

    networks:
      - azentia_network

    depends_on:
      - backend

  backend:
    container_name: backend

    build:
      context: .
      dockerfile: ./services/backend/Dockerfile

    restart: always

    env_file:
      - .env

    environment:
      NODE_ENV: production
      BACKEND_PORT: 1600

      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: azentia
      DB_PASSWORD: azentia
      DB_DATABASE: azentia

      FRONT_END_BASE_URL: ${FRONT_END_BASE_URL}

      SMTP_PORT: ${SMTP_PORT}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}

      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD}

      TWILLIO_PASSWORD: ${TWILLIO_PASSWORD}
      TWILLIO_USER: ${TWILLIO_USER}

    ports:
      - '1600:1600'

    networks:
      - azentia_network

    depends_on:
      - db

  db:
    image: postgres:16.0
    container_name: azentia-db

    restart: always

    environment:
      POSTGRES_USER: azentia
      POSTGRES_PASSWORD: azentia
      POSTGRES_DB: azentia

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - azentia_network

volumes:
  postgres_data:

networks:
  azentia_network:
    driver: bridge
